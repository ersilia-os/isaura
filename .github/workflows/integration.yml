name: Integration tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/ready || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_LOCAL_AK: minioadmin
      MINIO_LOCAL_SK: minioadmin
      ISAURA_TEST_MODEL: eos3b5e
      ISAURA_TEST_VERSION: v1
      ISAURA_TEST_BUCKET: isaura-test
      ISAURA_TEST_INPUT: tests/data.csv
      POETRY_VIRTUALENVS_IN_PROJECT: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip pipx
          pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Wait for MinIO
        run: |
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/ready && exit 0
            sleep 2
          done
          exit 1

      - name: Run integration tests
        run: poetry run pytest tests/test_workflow.py -v --tb=short