name: Integration tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_LOCAL_AK: minioadmin
      MINIO_LOCAL_SK: minioadmin
      ISAURA_TEST_MODEL: eos3b5e
      ISAURA_TEST_VERSION: v1
      ISAURA_TEST_BUCKET: isaura-test
      ISAURA_TEST_INPUT: tests/data.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and test tools
        run: |
          pip install -e .
          pip install pytest

      - name: Start Isaura engine
        run: |
          isaura engine -s

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..60}; do
            if curl -fsS http://localhost:9000/minio/health/ready > /dev/null; then
              echo "Services are ready"
              exit 0
            fi
            echo "Waiting for engine services... ($i/60)"
            sleep 2
          done

          echo "Engine services did not become ready in time"
          exit 1

      - name: Run workflow integration tests
        run: pytest tests/test_workflow.py -v --tb=short