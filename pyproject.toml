[project]
name = "isaura"
version = "2.1.29"
description = "A lake of precalculated properties of biomedical entities based on the Ersilia Model Hub"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Miquel Duran Frigola", email = "miquel@ersilia.io" },
  { name = "Abel Legese Shibiru", email = "abel@ersilia.io" },
  { name = "Marina Miñarro Lleonar", email = "marina@ersilia.io"}
]
dependencies = [
    "boto3>=1.40.35",
    "duckdb>=1.3.2",
    "loguru>=0.7.3",
    "pandas==2.3.0",
    "psutil==7.0.0",
    "pyarrow>=21.0.0",
    "pybloom-live>=4.0.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "rdkit>=2024.3.6",
    "requests>=2.32.5",
    "rich>=14.1.0",
    "questionary>=2.0.1",
    "rich-click>=1.8.9",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.12.9",
]

[project.scripts]
isaura = "isaura.cli:cli"

[tool.setuptools.package-data]
isaura = ["assets/**", "configs/**"]

[tool.setuptools.packages.find]
include = ["isaura*"]
exclude = ["files*", "tests*", "docs*"]

[build-system]
requires = ["setuptools>=78.1.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"